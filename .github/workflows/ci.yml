name: CI

on:
  push:
    branches: [main, phase-*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Check
        run: ruff check app tests

      - name: Ruff Format Check
        run: ruff format --check app tests

      - name: Mypy Check
        run: mypy app

      - name: Pytest with Coverage
        run: pytest --cov=app --cov-fail-under=90 --cov-report=term-missing

      - name: Snapshot Checksum Guard
        run: pytest tests/api/test_snapshot_guard.py -v

      - name: OpenAPI Drift Guard
        run: |
          cd ..
          python scripts/export_openapi.py
          git diff --exit-code frontend/src/api/openapi.json

      - name: Vercel requirements.txt Sync Check
        run: |
          cd ..
          python scripts/export_vercel_reqs.py --check

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Schema Drift Check
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - name: ESLint
        run: npm run lint

      - name: Type Check (tsc)
        run: npm run typecheck

      - name: Unit Tests (Vitest Coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle Size Budget Check (< 350 KB gz)
        run: npm run check:bundle

      - name: WCAG Contrast Check
        run: node scripts/contrast_check.mjs

  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start backend server
        run: |
          cd backend
          uvicorn app.main:app --port 8000 &
          sleep 3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          cd frontend
          npm run e2e
        env:
          CI: true

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 for Smoke Script
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install httpx for Smoke Script
        run: pip install httpx

      - name: Copy .env from example
        run: cp .env.example .env

      - name: Build Docker Stack
        run: docker compose build

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Run Deployment Smoke Test
        run: python scripts/smoke_deployed.py http://localhost:8080

      - name: Stop Docker Stack
        if: always()
        run: docker compose down
